appId: com.bennix.aigaokao
productName: AIGaokao
copyright: Copyright © 2026 ZHIPING XU
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
  - '**/better-sqlite3/**'
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.education
  icon: icon.icns
  identity: "ZHIPING XU (5N66S29EK2)"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize:
    teamId: 5N66S29EK2
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64]
dmg:
  title: AIGaokao
  icon: icon.icns
  iconSize: 80
  window:
    width: 660
    height: 400
  contents:
    - x: 180
      y: 170
      type: file
    - x: 480
      y: 170
      type: link
      path: /Applications
win:
  icon: icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: icon.png
  category: Education
  synopsis: 高考数学题库与 AI 知识图谱
  target:
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libdrm2
    - libgbm1
    - libxcb-dri3-0
rpm:
  depends:
    - /usr/bin/xdg-utils
publish:
  provider: github
  owner: bennix
  repo: AIGaokao
  releaseType: release
